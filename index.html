<!doctype html>
<html lang="nl-BE" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Permite que o navegador entenda que o site oferece suporte a ambos os temas (Evita inversões forçadas bugadas) -->
  <meta name="color-scheme" content="light dark" />

  <!-- Metadados de SEO Primários -->
  <title>O Clarim Belga — Portal de Dados e Jornalismo do Reino da Bélgica</title>
  <meta name="title" content="O Clarim Belga — Portal de Dados e Jornalismo do Reino da Bélgica" />
  <meta name="description"
    content="Explore a história, geografia, clima, economia, cultura e esportes da Bélgica. Um portal analítico-jornalístico interativo de alta performance com dados dinâmicos e cartografia avançada." />
  <meta name="author" content="O Clarim Belga Editorial" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (Compartilhamento em Redes Sociais) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://oclarimbelga.be/" />
  <meta property="og:title" content="O Clarim Belga — Portal de Dados e Jornalismo do Reino da Bélgica" />
  <meta property="og:description"
    content="Explore a história, geografia, clima, economia e esportes da Bélgica com análises interativas de alta precisão." />
  <meta property="og:image" content="/assets/og-image.jpg" />

  <!-- Localização Belga -->
  <meta property="og:locale" content="nl_BE" />
  <meta property="og:locale:alternate" content="fr_BE" />
  <meta property="og:locale:alternate" content="de_BE" />

  <!-- Twitter / X Card Meta Tags -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="O Clarim Belga — Portal de Dados e Jornalismo do Reino da Bélgica" />
  <meta property="twitter:description" content="Análises interativas e jornalismo de dados sob o Reino da Bélgica." />
  <meta property="twitter:image" content="/assets/og-image.jpg" />

  <!-- Favicons e Ícones de Dispositivos Móveis -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

  <!-- Otimização de Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Tipografia Editorial -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet" />

  <!-- CSS Crítico Adaptável para Modo Claro/Escuro -->
  <style>
    /* Estilos base para Modo Claro */
    html,
    body {
      background-color: #FAFAF8;
      color: #1a1a1a;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Estilos dinâmicos quando a classe '.dark' for ativada pelo React */
    html.dark,
    html.dark body {
      background-color: #090B0F !important;
      color: #F1F5F9 !important;
    }

    /* Isolamento absoluto da bandeira contra inversão do navegador */
    .bandeira-belgica,
    .bandeira-belgica * {
      color-scheme: only light !important;
      forced-color-adjust: none !important;
    }
  </style>
</head>

<body class="antialiased min-h-screen">

  <!-- Acessibilidade Estrita (Skip Link / WCAG 2.1) -->
  <a href="#main-content"
    class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:bg-amber-500 focus:text-slate-950 focus:px-4 focus:py-2 focus:rounded-md focus:font-semibold">
    Ir para o conteúdo principal
  </a>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
